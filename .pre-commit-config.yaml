repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-added-large-files

  - repo: local
    hooks:
      - id: lint
        name: eslint
        entry: bash -c 'source ~/.nvm/nvm.sh && nvm use default --silent && npm run lint'
        language: system
        pass_filenames: false
        stages: [pre-commit]

      - id: test
        name: vitest
        entry: bash -c 'source ~/.nvm/nvm.sh && nvm use default --silent && npm test'
        language: system
        pass_filenames: false
        stages: [pre-push]

      - id: build
        name: next-build
        entry: bash -c 'source ~/.nvm/nvm.sh && nvm use default --silent && npm run build'
        language: system
        pass_filenames: false
        stages: [pre-push]
